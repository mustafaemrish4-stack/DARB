<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Player</title>
    <!-- Use stable A-Frame version -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        overflow: hidden; background: #000; touch-action: none;
        font-family: sans-serif;
      }
      #play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 40px;
        font-size: 24px;
        background-color: #8A1734;
        color: white;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        z-index: 9999;
        font-family: sans-serif;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      #mute-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
        background: rgba(0,0,0,0.6);
        color: white;
        border: 2px solid white;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 24px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #close-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: rgba(255, 0, 0, 0.8);
        color: white;
        border: 2px solid white;
        border-radius: 30px;
        cursor: pointer;
        display: none;
        z-index: 9999;
        font-family: sans-serif;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      #fs-btn, #vr-btn {
        position: absolute;
        top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        color: white;
        border: 2px solid white;
        border-radius: 30px;
        cursor: pointer;
        z-index: 9999;
        font-family: sans-serif;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      #fs-btn {
        left: 50%;
        transform: translateX(-110%);
        background-color: rgba(41, 121, 255, 0.9);
      }
      #vr-btn {
        left: 50%;
        transform: translateX(10%);
        background-color: rgba(233, 30, 99, 0.9);
      }
    </style>
  </head>
  <body>
    <!-- Play button overlay required for mobile browsers to allow video playback -->
    <button id="play-btn">▶ تشغيل الآن</button>
    <button id="mute-btn">🔊</button>
    <button id="close-btn">❌ خروج</button>
    <button id="fs-btn">تكبير الشاشة</button>
    <button id="vr-btn">وضع VR Box</button>

    <a-scene 
      loading-screen="dotsColor: white; backgroundColor: black" 
      vr-mode-ui="enabled: true"
      device-orientation-permission-ui="enabled: true"
    >
      <a-assets>
        <video 
          id="vid" 
          loop 
          playsinline 
          webkit-playsinline 
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-videosphere src="#vid" rotation="0 -90 0"></a-videosphere>
      <a-entity camera look-controls="mouseEnabled: true; reverseMouseDrag: true; touchEnabled: true"></a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent('stereo-video', {
        schema: {
          isTopBottom: { type: 'boolean', default: false }
        },
        init: function () {
          this.hasCropped = false;
        },
        tick: function () {
          if (!this.data.isTopBottom || this.hasCropped) return;
          const mesh = this.el.getObject3D('mesh');
          if (mesh && mesh.material && mesh.material.map) {
            mesh.material.map.repeat.set(1, 0.5);
            mesh.material.map.offset.set(0, 0.5);
            this.hasCropped = true;
          }
        }
      });
      
      const urlParams = new URLSearchParams(window.location.search);
      const vidSrc = urlParams.get('video');
      const isStereo = urlParams.get('stereo') === 'true';
      const video = document.getElementById('vid');
      const playBtn = document.getElementById('play-btn');
      const muteBtn = document.getElementById('mute-btn');
      const closeBtn = document.getElementById('close-btn');

      if (isStereo) {
        document.querySelector('a-videosphere').setAttribute('stereo-video', 'isTopBottom: true');
      }

      if (vidSrc) {
        video.src = vidSrc;
        video.load();
        
        // Force Jenin videos 1 to 5 to start at 60 seconds (1 minute mark)
        if (vidSrc.includes('jenin1.mp4') || vidSrc.includes('jenin2.mp4') || 
            vidSrc.includes('jenin3.mp4') || vidSrc.includes('jenin4.mp4') || 
            vidSrc.includes('jenin5.mp4')) {
          video.addEventListener('loadedmetadata', () => {
            video.currentTime = 60;
          });
        }
      }

      playBtn.addEventListener('click', () => {
        video.play().then(() => {
          playBtn.style.display = 'none';
          muteBtn.style.display = 'flex';
        }).catch(err => {
          console.error("Playback failed:", err);
        });
      });

      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.textContent = video.muted ? '🔇' : '🔊';
      });

      closeBtn.addEventListener('click', () => {
        // Stop video
        video.pause();
        // Exit VR if in VR
        const scene = document.querySelector('a-scene');
        if (scene && scene.is('vr-mode')) {
          scene.exitVR();
        }
        // Tell React app to close
        window.parent.postMessage('close-vr', '*');
      });

      // Try autoplay (might work on desktop)
      video.play().then(() => {
        playBtn.style.display = 'none';
        muteBtn.style.display = 'flex';
      }).catch(e => {
        // Autoplay blocked, wait for user click
      });
      
      // When entering VR, standard HTML elements are hidden on some headsets/browsers.
      // This is native behavior of WebXR, you can't bypass it without drawing UI in WebGL.
      // We will just let users exit VR natively (ESC / Back gesture).

      document.getElementById('fs-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable fullscreen: ${err.message}`);
          });
        } else {
          document.exitFullscreen();
        }
      });

      document.getElementById('vr-btn').addEventListener('click', () => {
        const scene = document.querySelector('a-scene');
        if (scene) {
          scene.enterVR();
        }
      });
      
      const sceneEl = document.querySelector('a-scene');
      
      function updateCloseBtn() {
        const isFS = !!document.fullscreenElement;
        const isVR = sceneEl && sceneEl.is('vr-mode');
        closeBtn.style.display = (isFS || isVR) ? 'block' : 'none';
      }

      document.addEventListener('fullscreenchange', updateCloseBtn);
      if(sceneEl) {
        sceneEl.addEventListener('enter-vr', updateCloseBtn);
        sceneEl.addEventListener('exit-vr', updateCloseBtn);
      }
    </script>
  </body>
</html>
